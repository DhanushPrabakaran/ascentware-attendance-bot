name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires DATABASE_URL even for `prisma generate`, which never
      # connects. A placeholder is enough - no CI step talks to a real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint backend
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
